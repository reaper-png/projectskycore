[IDConfig]
	#FE held by an unupgraded energy drawer, before the storage upgrades are applied. Expressed as ENERGY_BASE_UNITS x FE_PER_UNIT, mirroring how a fluid drawer is a slot count times 1000 mB.
	# Default: 500
	# Range: > 1
	ENERGY_BASE_UNITS = 500
	#FE per base unit. Change this to move the whole curve without touching the upgrade maths.
	# Default: 1000
	# Range: > 1
	FE_PER_UNIT = 1000
	#How much every storage upgrade's multiplier is divided by for energy, the same way Functional Storage's FLUID_DIVISOR works for fluids. Higher means a flatter curve. With the default of 4 and a Netherite multiplier of 32, four upgrades give 8^4 = 4096, so a fully upgraded drawer holds about 2.05 billion FE.
	# Default: 4
	# Range: > 1
	ENERGY_DIVISOR = 4
	#Whether an energy drawer hands energy to the blocks around it on its own. Turn this off and the drawer only gives energy up to something that asks for it - which, unlike items and fluids, almost nothing in the Forge Energy ecosystem does.
	PUSH_TO_NEIGHBOURS = true
	#Throughput, as a divisor of the drawer's own capacity: 200 means it can hand out half a percent of what it holds per push. Bigger drawers therefore move more, which keeps a fully upgraded one from being a bottleneck and a base one from being a free superhighway.
	# Default: 200
	# Range: > 1
	ENERGY_TRANSFER_DIVISOR = 200
	#How far the Wireless Charger reaches, in blocks. Measured from the drawer, so a wall of them covers a room without stacking range on top of range.
	# Default: 8
	# Range: > 1
	WIRELESS_CHARGER_RANGE = 8
	#FE the Wireless Charger hands out per sweep, shared across everyone in range. It never gives out more than the drawer holds.
	# Default: 1000
	# Range: > 1
	WIRELESS_CHARGER_FE_PER_OPERATION = 1000
	#Ticks between Wireless Charger sweeps. Each sweep looks for players in range, so lowering this costs an entity query more often.
	# Default: 20
	# Range: > 1
	WIRELESS_CHARGER_INTERVAL_TICKS = 20
	#Ticks between pushes. Four matches the cadence Functional Storage gives its upgrades. Lowering it makes drawers more responsive and makes a large wall cost proportionally more to tick.
	# Default: 4
	# Range: > 1
	ENERGY_PUSH_INTERVAL_TICKS = 4
	#mB of chemical per unit of a chemical drawer's base size, the same role 1000 mB plays for Functional Storage's fluid drawers - which is also the default, so an unupgraded 1x1 chemical drawer holds 32,000 mB like a fluid drawer. Storage upgrades scale it with the fluid multipliers. Only read when Mekanism is installed.
	# Default: 1000
	# Range: > 1
	CHEMICAL_MB_PER_UNIT = 1000
	#Source per unit of the Source Drawer's base size, the role 1000 mB plays for a fluid drawer. The drawer is 32 units and scales with the fluid multipliers, so the default holds 32,000 Source (3.2 Source Jars) unupgraded and 2,097,152,000 with four Netherite upgrades - just under the int ceiling of Ars Nouveau's Source API. Raising this makes the top of the curve saturate there. Only read when Ars Nouveau is installed.
	# Default: 1000
	# Range: > 1
	SOURCE_PER_UNIT = 1000
	#Whether the Energy Drawer and its framed variant can be crafted and appear in the creative tab. Turning this off never removes drawers already placed; they keep working and keep their energy.
	ENERGY_DRAWER_ENABLED = true
	#Whether the Chemical Drawers (all three layouts, framed or not) can be crafted and appear in the creative tab. They only exist with Mekanism installed; this switch cannot bring them back without it. Drawers already placed keep working.
	CHEMICAL_DRAWERS_ENABLED = true
	#Whether the Source Drawer and its framed variant can be crafted and appear in the creative tab. They only exist with Ars Nouveau installed. Drawers already placed keep working.
	SOURCE_DRAWER_ENABLED = true
	#Whether the Wireless Charger augment can be crafted and appears in the creative tab. Chargers already in drawers keep working.
	WIRELESS_CHARGER_ENABLED = true
